name: oura-platform

x-dotnet-env: &dotnet-env
  ConnectionStrings__Postgres: "Host=timescaledb;Port=5432;Database=${POSTGRES_DB:-oura};Username=${POSTGRES_USER:-oura};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
  Oura__ClientId: "${Oura__ClientId:?register an app at https://developer.ouraring.com}"
  Oura__ClientSecret: "${Oura__ClientSecret:?register an app at https://developer.ouraring.com}"
  Oura__RedirectUri: "${Oura__RedirectUri:-http://localhost:8080/oauth/callback}"
  # One source for the default: OuraOptions.Scopes. Keep the two identical (see docs/oura-api-notes.md).
  Oura__Scopes: "${Oura__Scopes:-personal daily heartrate workout tag session spo2 stress heart_health ring_configuration}"
  Oura__UseSandbox: "${Oura__UseSandbox:-false}"
  Oura__BackfillFrom: "${Oura__BackfillFrom:-2020-01-01}"
  Oura__ReconcileTrailingDays: "${Oura__ReconcileTrailingDays:-7}"
  TZ: "${TZ:-UTC}"

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-oura}"
      POSTGRES_USER: "${POSTGRES_USER:-oura}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      TZ: "${TZ:-UTC}"
    ports:
      # Bound to loopback: the only reason to expose this is ad-hoc psql from the host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oura} -d ${POSTGRES_DB:-oura}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Runs the migrations, backfills once, then reconciles a trailing window on a timer.
  # Single instance by design -- see the invariant in CLAUDE.md. Do not scale this.
  ingest:
    image: ghcr.io/egoushka/oura-ingest:${OURA_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment: *dotnet-env
    # Passes the optional Context__* calendar settings from .env to the importer (compose does not
    # forward arbitrary .env keys on its own). `environment` above wins on any overlap.
    env_file: .env

  # OAuth callback and health only. No auth of its own: it sits behind the reverse proxy.
  api:
    image: ghcr.io/egoushka/oura-api:${OURA_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment: *dotnet-env
    ports:
      # Loopback: nothing here authenticates its callers, and /oauth/start links whichever Oura
      # account completes it.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      # /healthz reports Degraded until the browser handshake is done, which is still a 200.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Stage 4. Read-only analytics over the warehouse, spoken as MCP. It holds no Oura credential
  # of its own and never calls the API — the value is in the joins, not in proxying the phone app.
  mcp:
    image: ghcr.io/egoushka/oura-mcp:${OURA_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment: *dotnet-env
    ports:
      # Loopback: no auth, and it serves health data. Put an authenticating proxy in front to share it.
      - "127.0.0.1:${MCP_PORT:-8081}:8080"
    healthcheck:
      # Degraded, still a 200, until ingest has backfilled anything to analyse.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional: `docker compose --profile grafana up -d`. Datasource and the three dashboards are
  # provisioned from grafana/, so there is nothing to click. Skip the profile to use your own Grafana.
  grafana:
    profiles: ["grafana"]
    image: grafana/grafana-oss:11.6.5
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      # Empty falls back to Grafana's own admin/admin, which it forces you to change on first login.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Interpolated into grafana/provisioning/datasources/timescaledb.yml.
      POSTGRES_DB: "${POSTGRES_DB:-oura}"
      POSTGRES_USER: "${POSTGRES_USER:-oura}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      TZ: "${TZ:-UTC}"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  timescale-data:
  grafana-data:
